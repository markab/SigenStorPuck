; SigenStorPuck — firmware for the Waveshare ESP32-S3-Touch-AMOLED boards.
;
; Environments (see docs/PLAN.md §B1):
;   puck      1.75" round board (466x466), USB flash — the default
;   puck241   2.41" landscape board (600x450), USB flash
;   sim       SDL desktop build — needs SDL2 (brew install sdl2)
;
; puck and puck241 share everything in [puck_base]; they differ only by the
; board profile (board_config.h dispatches on -D PUCK_BOARD_2P41) and, once the
; 2.41 backends land, the display/touch/UI source they compile.
;
; Screen work belongs in sim: a second-long edit-run loop instead of a flash
; cycle (§B5). All environments share src/ except for the hardware backends.

[platformio]
default_envs = puck

[puck_base]
; pioarduino's fork of platform-espressif32; 53.03.13 is Arduino-ESP32 3.1.3,
; the combination known to work with LVGL 8.4 on this board. Arduino 3.x is
; also what provides WiFiClientSecure::setCACertBundle() for §B3.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; The stock devkit board definition assumes 4 MB flash and no PSRAM. This board
; is an ESP32-S3R8: 16 MB QIO flash and 8 MB octal-SPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
; Stock 16 MB table: two ~6.5 MB app slots, so a failed OTA rolls back (§C3).
; Leave maximum_size alone — PlatformIO derives it from this CSV, and that
; derived value is what catches an app that has outgrown its slot.
board_build.partitions = default_16MB.csv

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D BOARD_HAS_PSRAM
	; USB-CDC serial: this board has no separate UART bridge.
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Find include/lv_conf.h on the include path rather than by relative path,
	; so the same header serves the sim environment unchanged. The explicit
	; -I is needed: without it LVGL's own sources do not see include/, and
	; lv_conf_internal.h silently falls back to its defaults.
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src

; The SDL backend under src/sim/ is desktop-only. The 2.41's RM690B0/FT6336
; backends and the landscape UI are excluded here so puck compiles only the
; CO5300/CST9217 pair and the round UI under src/ui/.
build_src_filter = +<*> -<sim/> -<display_sh8601.cpp> -<touch_ft6336.cpp> -<ui_landscape/>

lib_deps =
	lvgl/lvgl@8.4.0
	moononournation/GFX Library for Arduino@1.6.4
	; CST9217 touch. Waveshare's examples use this library's TouchDrvCST92xx.
	lewisxhe/SensorLib@0.4.1
	bblanchon/ArduinoJson@^7
	; Captive-portal WiFi provisioning. 2.0.17 is the first release that works
	; with Arduino-ESP32 3.x.
	https://github.com/tzapu/WiFiManager.git#v2.0.17
	; AXP2101 PMIC, for the Puck's own battery state.
	lewisxhe/XPowersLib@0.3.3

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; -----------------------------------------------------------------------------
; The two device environments. Everything above is shared in [puck_base]; each
; env below selects its board profile and its hardware backends. Note the
; PlatformIO gotcha: extends REPLACES list-valued keys rather than merging them,
; so puck241 re-references ${puck_base.build_flags} before appending its flag,
; and restates the whole build_src_filter. lib_deps are inherited unchanged
; (SensorLib already covers FT6336, GFX already covers RM690B0). The landscape UI
; swap is added here in Phase 3.
[env:puck]
extends = puck_base

[env:puck241]
extends = puck_base
; -I src/ui puts the shared UI headers (theme.h, screen_*.h, qr_block.h, format.h)
; on the path for the landscape sources under src/ui_landscape/.
build_flags = ${puck_base.build_flags} -D PUCK_BOARD_2P41 -I src/ui
; Swap the CO5300/CST9217 backends for the 2.41's RM690B0/FT6336 pair, and the
; round UI (ui.cpp + the round screens + the round chart_band) for the landscape
; set under src/ui_landscape/. Shared UI infra (format.cpp, qr_block.cpp) stays.
build_src_filter = +<*> -<sim/> -<display.cpp> -<touch.cpp>
	-<ui/ui.cpp>
	-<ui/screen_power.cpp> -<ui/screen_battery.cpp> -<ui/screen_solar.cpp>
	-<ui/screen_load.cpp> -<ui/screen_flows.cpp> -<ui/screen_cost.cpp>
	-<ui/screen_settings.cpp>

; -----------------------------------------------------------------------------
; Desktop simulator. Same LVGL, same lv_conf.h, same screen code, same snapshot
; parser — only the display and input backends differ.
;
;   pio run -e sim && .pio/build/sim/program
;
; Run it from the repo root so it finds test/fixtures, or pass a directory.
[env:sim]
platform = native

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-I include
	-I src
	; Keep SDL's headers from renaming main(); sim_backend calls
	; SDL_SetMainReady() instead.
	-D SDL_MAIN_HANDLED
	!sdl2-config --cflags
	!sdl2-config --libs

; Swap the Arduino hardware backends for src/sim/. The snapshot model, the
; enrolment-URL parser and every screen are shared, which is the entire point.
; src/device/ is WiFi, NVS and HTTP — Arduino-only, so it is excluded here.
; The Arduino display/touch backends (both boards') and the landscape UI are
; excluded too — the sim previews the round board.
build_src_filter = +<*> -<main.cpp> -<display.cpp> -<touch.cpp> -<display_sh8601.cpp> -<touch_ft6336.cpp> -<device/> -<ui_landscape/>

lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7

; -----------------------------------------------------------------------------
; Desktop simulator for the 2.41 landscape UI: same SDL backend as [env:sim] but
; with the 2.41 board profile (600x450) and the landscape screen-set. Lets the
; landscape screens be previewed and screenshotted without a real 2.41.
;
;   pio run -e sim241 && .pio/build/sim241/program test/fixtures --shot /tmp/shots241
[env:sim241]
platform = native

build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D PUCK_BOARD_2P41
	-I include
	-I src
	-I src/ui
	-D SDL_MAIN_HANDLED
	!sdl2-config --cflags
	!sdl2-config --libs

build_src_filter = +<*> -<main.cpp> -<display.cpp> -<touch.cpp>
	-<display_sh8601.cpp> -<touch_ft6336.cpp> -<device/>
	-<ui/ui.cpp>
	-<ui/screen_power.cpp> -<ui/screen_battery.cpp> -<ui/screen_solar.cpp>
	-<ui/screen_load.cpp> -<ui/screen_flows.cpp> -<ui/screen_cost.cpp>
	-<ui/screen_settings.cpp>

lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7
